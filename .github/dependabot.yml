version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Next and React move together; other minor/patch updates come in one PR
    # for dev tooling and one for runtime. Every other major upgrade comes on
    # its own, to be migrated and reviewed. A package goes to the first group
    # that matches.
    groups:
      framework:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime-minor-and-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Follows the Node major the app runs on (22, in CI and on Vercel).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
