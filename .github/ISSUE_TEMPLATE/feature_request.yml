name: Feature request
description: Suggest a check or an improvement to the report
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Pode escrever em português.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Who it helps and in what situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
