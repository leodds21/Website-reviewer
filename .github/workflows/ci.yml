name: CI

on:
  push:
    branches: [master]
  pull_request:

# The workflow only reads the code; nothing it runs needs to write to the
# repository, even when it runs on a pull request from a fork.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The UI flow in a real browser, against the build above (see
      # playwright.config.ts: the analysis endpoint is mocked per test).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
